name: Run PowerShell Script

on:
  workflow_dispatch:
    inputs:
      scriptPath:
        description: Path to PowerShell script
        required: true
        default: Path_to_script_here

jobs:
  run:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Record existing files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File |
            Where-Object {
              $_.Extension -in '.txt','.csv','.xlsx'
            } |
            Select-Object FullName, LastWriteTimeUtc |
            Export-Csv before.csv -NoTypeInformation

      - name: Run Script
        shell: pwsh
        run: |
          & "${{ github.event.inputs.scriptPath }}"

      - name: Find new or modified files
        shell: pwsh
        run: |
          $before = Import-Csv before.csv

          New-Item -ItemType Directory -Force -Path Artifacts

          $after = Get-ChildItem -Recurse -File |
            Where-Object {
              $_.Extension -in '.txt','.csv','.xlsx' -and
              $_.Name -ne 'before.csv' -and
              $_.FullName -notmatch '\\Artifacts\\'
            }

          foreach ($file in $after) {

            $existing = $before | Where-Object {
              $_.FullName -eq $file.FullName
            }

            $copyFile = $false

            # New file
            if (-not $existing) {
              $copyFile = $true
            }
            else {
              # Existing file modified
              if ($file.LastWriteTimeUtc -gt ([datetime]$existing.LastWriteTimeUtc)) {
                $copyFile = $true
              }
            }

            if ($copyFile) {
              Copy-Item $file.FullName Artifacts -Force
            }
          }

      - name: Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.run_number }}
          path: Artifacts/**
          if-no-files-found: ignore